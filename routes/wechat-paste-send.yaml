name: wechat-paste-send
app: WeChat
description: In the open chat, paste the message (already on the clipboard), check it landed, then send with Return.
# 160,726 = input bar while the keyboard is down.
steps:
  - assert_visible: "${CONTACT}"
  - tap: @160,726
  - press_key: "v+command"
  - wait_for: "${MSG_CHECK}"
  - press_key: "return"
